spring.application.name=andanza-backend

# Postgres (Supabase en producción, Postgres local para desarrollar).
# Nunca hardcodear credenciales reales aca -- se pasan por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/andanza}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
