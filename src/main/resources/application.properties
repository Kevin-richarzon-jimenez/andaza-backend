spring.application.name=andanza-backend

# Postgres (Supabase en producción, Postgres local para desarrollar).
# Nunca hardcodear credenciales reales aquí: se pasan por variables de entorno o por el perfil local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/andanza}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El Session Pooler de Supabase admite pocos clientes en total (15 en el plan gratis) y cada instancia del
# backend, la desplegada y las de cada integrante corriendo en local, reserva su propio pool: por eso es chico.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# El esquema lo crea y versiona Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.port=${PORT:8080}

# Solo se expone /actuator/health (nada de env, beans ni configuración). Sin detalle de componentes para
# usuarios anónimos; el administrador sí lo ve completo.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# Imágenes de los productos: se guardan en un bucket público de Supabase Storage. Sin estas variables el backend
# arranca igual, pero subir imágenes responde 503. La llave de servicio da acceso total al proyecto: nunca se comitea.
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.bucket=${SUPABASE_BUCKET:product-images}
# Cada imagen llega ya reducida (unos 100-200 KB); estos topes frenan lo que no lo esté.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# JWT: el secreto es obligatorio y debe tener al menos 32 caracteres (ver application-local.properties.example).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Orígenes del frontend autorizados por CORS, separados por coma.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger UI y el JSON de la API: útiles para desarrollar; en producción conviene SWAGGER_ENABLED=false.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
